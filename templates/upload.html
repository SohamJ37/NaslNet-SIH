<!DOCTYPE html>
<html lang="en">
{% include "header.html" %}

<main class="main">
    <section id="services" class="services section">
    <!-- Section Title -->
        <div class="container section-title" data-aos="fade-up">
        <h2>Upload Image</h2>
        <p>Upload 3 images of the Cattle or Buffalo you want to know about.</p>
      </div><!-- End Section Title -->

      <form method="post" action="{{ url_for('index') }}" enctype="multipart/form-data">

      <div class="container">

        <div class="row g-5">
        {% set colors=['cyan', 'orange', 'teal'] %}
        {% for i in range(3) %}

          <div class="col-lg-4 col-md-6" data-aos="fade-up" data-aos-delay="{{(i+1)*100}}">
            <div class="service-item item-{{colors[i]}} position-relative">
              <i class="bi bi-{{ i+1 }}-circle icon"></i>
              <h3>Image {{i+1}}</h3>
              <!-- <p>Provident nihil minus qui consequatur non omnis maiores. Eos accusantium minus dolores iure perferendis tempore et consequatur.</p> -->
              <br>
              <center><input type="file" name="files" accept=".png,.jpg,.jpeg,.gif,.pdf" required></center>
            </div>
          </div><!-- End Service Item -->
        {% endfor %}
        </div>

        </section><!-- /Services Section -->

        <!-- Call To Action Section -->
        <section id="call-to-action" class="call-to-action section accent-background">

        <div class="container">

            <div class="row" data-aos="zoom-in" data-aos-delay="100">
            <div class="col-xl-9 text-center text-xl-start">
                <h3>Upload</h3>
                <p>Upload selected images to get details about the breed.</p>
            </div>
            <div class="col-xl-3 cta-btn-container text-center">
                <button type="submit" class="cta-btn align-middle">Upload</button>
            </div>
            </div>
            </form>

        </div>

        </section><!-- /Call To Action Section -->
</main>
{% include "footer.html" %}
</html>
